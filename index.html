<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SMTrans95 – Лек транспорт до 3.5 т</title>

<style>
:root{
  --bg:#f2f4f8;
  --card:#ffffff;
  --text:#0b1220;
  --muted:#475569;
  --blue:#2E86DE;
  --green:#00c2a8;
  --line:rgba(2,6,23,.12);

  /* ✅ ДОБАВЕНИ, БЕЗ ДА СЕ ПИПА CSS-ЪТ */
  --accent:#2E86DE;
  --accent2:#00c2a8;
}

/* ================= BASE ================= */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{text-decoration:none;color:inherit}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 18px;
}

/* ================= HEADER + TABS ================= */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#ffd84d;
  border-bottom:1px solid rgba(0,0,0,.12);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:14px 0;
}

/* logo */
.logo{
  font-size:22px;
  font-weight:900;
}
.logo .sm{color:#0b1220}
.logo .trans{color:var(--blue)}
.logo .n95{color:var(--green)}

/* tabs */
.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.tab{
  padding:10px 16px;
  border-radius:14px;
  font-weight:900;
  background:linear-gradient(135deg,#2e86de,#00c2a8);
  color:#04151c;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.18);
  transition:.2s;
}
.tab:hover{transform:translateY(-1px)}
.tab.active{
  background:#9ca3af;
  color:#111;
  box-shadow:none;
}

/* ================= CONTENT ================= */
main{padding:40px 0}
.tabpage{display:none}
.tabpage.active{display:block}

/* ================= HERO ================= */
.hero-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:22px;
}

@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr}
}

.h1{
  font-size:44px;
  line-height:1.06;
  margin:0 0 14px;
}

.hero-logo{font-weight:900}
.hero-logo .sm{color:var(--text)}
.hero-logo .trans{color:var(--accent)}
.hero-logo .n95{color:var(--accent2)}

.lead{
  max-width:60ch;
  color:var(--muted);
  line-height:1.6;
}

/* ================= CTA ================= */
.cta{
  display:flex;
  gap:14px;
  margin-top:18px;
  flex-wrap:wrap;
}

.btn{
  padding:14px 22px;
  border-radius:14px;
  border:1px solid var(--line);
  font-weight:800;
  background:#fff;
  cursor:pointer;
}

.cta-hot{
  padding:18px 30px;
  font-size:20px;
  font-weight:900;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#00ffd0,#33ccff);
  color:#05201a;
  cursor:pointer;
  box-shadow:0 22px 48px rgba(0,255,208,.85),0 8px 18px rgba(0,0,0,.25);
  animation:ctaPulse 2.6s ease-in-out infinite;
}

@keyframes ctaPulse{
  0%{transform:scale(.95)}
  50%{transform:scale(1.08)}
  100%{transform:scale(.95)}
}

/* ================= CARDS ================= */
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 14px 30px rgba(0,0,0,.10);
}

.section-title{font-size:20px;margin:0 0 12px}

/* ================= KPI ================= */
.kpis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.kpi{
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#fff;
}

.kpi .n{font-weight:900;font-size:18px}
.kpi .t{font-size:12px;color:var(--muted)}

/* ================= FOOTER ================= */
footer{
  border-top:1px solid var(--line);
  padding:30px 0;
  color:var(--muted);
  font-size:13px;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-box{
  background:#fff;
  padding:24px;
  width:100%;
  max-width:420px;
  border-radius:16px;
  position:relative;
}

.modal-box input,
.modal-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

.modal-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:800;
  background:#22c55e;
  color:#fff;
}

.close{
  position:absolute;
  top:10px;
  right:14px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="wrap topbar">
    <div class="logo">
      <span class="sm">SM</span><span class="trans">Trans</span><span class="n95">95</span>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="home">Начало</div>
      <div class="tab" data-tab="about">Кои сме</div>
      <div class="tab" data-tab="services">Услуги</div>
      <div class="tab" data-tab="fleet">Автопарк</div>
      <div class="tab" data-tab="contact">Контакти</div>
    </div>
  </div>
</header>

<main class="wrap">
<section class="tabpage active" data-page="home">
  <div class="hero-grid">
    <div>
      <h1 class="h1">
        <span class="hero-logo">
          <span class="sm">SM</span><span class="trans">Trans</span><span class="n95">95</span>
        </span>
        ЕООД<br>Лек транспорт и доставки
      </h1>

      <p class="lead">
        В момента сме в подготовка за стартиране на дейността.
        Приемаме запитвания за <strong>лек транспорт до 3.5 т</strong>.
      </p>

      <div class="cta">
        <button class="cta-hot" onclick="openModal()">Запитване</button>
        <div class="btn">Какво предлагаме</div>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">© <span id="y"></span> SMTrans95 ЕООД</div>
</footer>

<script>
document.getElementById("y").textContent=new Date().getFullYear();

function openModal(){
  document.getElementById("contactModal").style.display="flex";
}
function closeModal(){
  document.getElementById("contactModal").style.display="none";
}

const inqForm = document.getElementById("inqForm");
if(inqForm) inqForm.addEventListener("submit", function(e){
  e.preventDefault();

  const name=this.name.value;
  const email=this.email.value;
  const phone=this.phone.value;
  const message=this.message.value;

  const subject=encodeURIComponent("Запитване от сайта SMTrans95");
  const body=encodeURIComponent(
    `Име: ${name}\nEmail: ${email}\nТелефон: ${phone}\n\nСъобщение:\n${message}`
  );

  window.location.href=`mailto:s_filipov@yahoo.com?subject=${subject}&body=${body}`;
});
</script>

<div class="modal" id="contactModal">
  <div class="modal-box">
    <h2>Попълнете контакт формата</h2>
    <form id="inqForm">
      <input name="name" placeholder="Име *" required>
      <input name="email" type="email" placeholder="e-Поща *" required>
      <input name="phone" placeholder="Тел. номер *" required>
      <textarea name="message" placeholder="Съобщение *" required></textarea>
      <button type="submit">Изпрати</button>
    </form>
    <span class="close" onclick="closeModal()">✕</span>
  </div>
</div>

</body>
</html>
